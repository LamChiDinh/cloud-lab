services:
  backend:
    image: lcdlamchidinh/mern-backend:1.0
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://lamchidinh:admin1234@cluster0.n9tkivq.mongodb.net/cloud_lab?retryWrites=true&w=majority
    networks:
      mern-network:
        aliases:
          - mern-backend

  frontend:
    image: lcdlamchidinh/mern-frontend:2.0
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
